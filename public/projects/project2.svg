<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bgGift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="50%" stop-color="#111a28"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cardGradGift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152336" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c1522" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadowGift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bgGift)"/>
  <circle cx="850" cy="180" r="240" fill="#14b8a6" opacity="0.1" filter="blur(70px)"/>
  <circle cx="300" cy="600" r="200" fill="#38bdf8" opacity="0.08" filter="blur(60px)"/>
  
  <g filter="url(#shadowGift)">
    <rect x="80" y="60" width="1040" height="630" rx="16" fill="url(#cardGradGift)" stroke="#22364c" stroke-width="1.5"/>
    
    <!-- Browser Window Header -->
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#0b121c" opacity="0.95"/>
    <circle cx="115" cy="84" r="6" fill="#ef4444"/>
    <circle cx="135" cy="84" r="6" fill="#f59e0b"/>
    <circle cx="155" cy="84" r="6" fill="#10b981"/>
    
    <rect x="400" y="72" width="400" height="24" rx="6" fill="#152334"/>
    <text x="600" y="88" fill="#7da0c2" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="500">https://giftlume.co.in/corporate-catalog</text>
    
    <!-- Hero / Promo Banner inside Mockup -->
    <g transform="translate(120, 130)">
      <rect x="0" y="0" width="960" height="150" rx="14" fill="#142436" stroke="#254160" stroke-width="1"/>
      <text x="40" y="52" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="25" font-weight="800">Giftlume — B2B Corporate Gifting Platform</text>
      <text x="40" y="82" fill="#9ab4cd" font-family="system-ui, sans-serif" font-size="13.5">Streamlined custom procurement, employee swag management, and automated bulk order fulfillment.</text>
      
      <rect x="40" y="102" width="145" height="32" rx="8" fill="url(#tealGrad)"/>
      <text x="112" y="122" fill="#041316" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore B2B Catalog</text>
      
      <!-- Right graphic inside banner -->
      <circle cx="860" cy="75" r="48" fill="url(#tealGrad)" opacity="0.2"/>
      <text x="860" y="72" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">🎁 Bulk Ready</text>
      <text x="860" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">500+ SKU Catalog</text>
    </g>
    
    <!-- Product Grid -->
    <g transform="translate(120, 310)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="300" height="330" rx="12" fill="#101926" stroke="#1f3248" stroke-width="1"/>
      <rect x="15" y="15" width="270" height="165" rx="8" fill="#162537"/>
      <circle cx="150" cy="98" r="40" fill="#2dd4bf" opacity="0.25"/>
      <text x="150" y="95" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🎁</text>
      <text x="150" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Premium Box</text>
      <text x="20" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Executive Welcome Kit</text>
      <text x="20" y="236" fill="#7d98b2" font-family="system-ui, sans-serif" font-size="12">Eco-leather diary + Steel bottle + Pen</text>
      <text x="20" y="278" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">₹1,499 <tspan font-size="11" fill="#64748b">/ unit</tspan></text>
      <rect x="175" y="258" width="110" height="32" rx="6" fill="#1b2f45"/>
      <text x="230" y="278" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">+ Add to Order</text>
      
      <!-- Item 2 -->
      <rect x="330" y="0" width="300" height="330" rx="12" fill="#101926" stroke="#1f3248" stroke-width="1"/>
      <rect x="345" y="15" width="270" height="165" rx="8" fill="#162537"/>
      <circle cx="480" cy="98" r="40" fill="#38bdf8" opacity="0.25"/>
      <text x="480" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🎧</text>
      <text x="480" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Smart Tech</text>
      <text x="350" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Festive Tech Swag Box</text>
      <text x="350" y="236" fill="#7d98b2" font-family="system-ui, sans-serif" font-size="12">Wireless earbuds + Power bank + Snacks</text>
      <text x="350" y="278" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">₹2,899 <tspan font-size="11" fill="#64748b">/ unit</tspan></text>
      <rect x="505" y="258" width="110" height="32" rx="6" fill="#1b2f45"/>
      <text x="560" y="278" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">+ Add to Order</text>
      
      <!-- Item 3 - B2B Bulk Order & RFQ Panel -->
      <rect x="660" y="0" width="300" height="330" rx="12" fill="#0d1624" stroke="#1f3248" stroke-width="1"/>
      <text x="680" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Corporate Bulk RFQ Cart</text>
      
      <rect x="680" y="58" width="260" height="60" rx="8" fill="#142132"/>
      <text x="695" y="82" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Selected Quantity: 150 Units</text>
      <text x="695" y="103" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5">✓ Custom Logo Engraving Included</text>
      
      <rect x="680" y="130" width="260" height="110" rx="8" fill="#101b2a"/>
      <text x="695" y="155" fill="#7d98b2" font-family="system-ui, sans-serif" font-size="11.5">Base Total: ₹3,37,350</text>
      <text x="695" y="178" fill="#7d98b2" font-family="system-ui, sans-serif" font-size="11.5">Volume Discount: -15% Tier</text>
      <text x="695" y="210" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Estimated: ₹2,86,747</text>
      
      <rect x="680" y="255" width="260" height="42" rx="8" fill="url(#tealGrad)"/>
      <text x="810" y="281" fill="#041316" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Generate B2B Quotation (PDF)</text>
    </g>
  </g>
</svg>
