<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e121a"/>
      <stop offset="50%" stop-color="#141a27"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182233" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1622" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <circle cx="850" cy="180" r="240" fill="#f59e0b" opacity="0.1" filter="blur(70px)"/>
  <circle cx="300" cy="600" r="200" fill="#ec4899" opacity="0.08" filter="blur(60px)"/>
  
  <g filter="url(#shadow2)">
    <rect x="80" y="60" width="1040" height="630" rx="16" fill="url(#cardGrad2)" stroke="#27384d" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#0d141e" opacity="0.9"/>
    <circle cx="115" cy="84" r="6" fill="#ef4444"/>
    <circle cx="135" cy="84" r="6" fill="#f59e0b"/>
    <circle cx="155" cy="84" r="6" fill="#10b981"/>
    
    <rect x="420" y="72" width="360" height="24" rx="6" fill="#182638"/>
    <text x="600" y="88" fill="#8da4be" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">store.aurora-commerce.cloud</text>
    
    <!-- Top banner / promo -->
    <g transform="translate(120, 130)">
      <rect x="0" y="0" width="960" height="150" rx="14" fill="#1a2b3f" stroke="#2b4360" stroke-width="1"/>
      <text x="40" y="55" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="26" font-weight="800">Aurora Next-Gen Headless Store</text>
      <text x="40" y="85" fill="#9ab4cd" font-family="system-ui, sans-serif" font-size="14">Edge-rendered catalog with sub-50ms TTFB and global inventory sync</text>
      
      <rect x="40" y="105" width="130" height="32" rx="8" fill="#f59e0b"/>
      <text x="105" y="125" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Shop Live Demo</text>
      
      <!-- Right graphic inside banner -->
      <circle cx="860" cy="75" r="50" fill="url(#amberGlow)" opacity="0.3"/>
      <text x="860" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">⚡ 99/100</text>
    </g>
    
    <!-- Product Grid -->
    <g transform="translate(120, 310)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="300" height="330" rx="12" fill="#121b27" stroke="#22354a" stroke-width="1"/>
      <rect x="15" y="15" width="270" height="170" rx="8" fill="#1b2838"/>
      <circle cx="150" cy="100" r="45" fill="#2dd4bf" opacity="0.3"/>
      <text x="150" y="106" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Quantum Watch Pro</text>
      <text x="20" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Quantum Watch Ultra</text>
      <text x="20" y="242" fill="#7d98b2" font-family="system-ui, sans-serif" font-size="12">Biometric sensor + Titanium case</text>
      <text x="20" y="285" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">$499.00</text>
      <rect x="180" y="265" width="105" height="32" rx="6" fill="#1e3247"/>
      <text x="232" y="285" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add to Cart</text>
      
      <!-- Item 2 -->
      <rect x="330" y="0" width="300" height="330" rx="12" fill="#121b27" stroke="#22354a" stroke-width="1"/>
      <rect x="345" y="15" width="270" height="170" rx="8" fill="#1b2838"/>
      <circle cx="480" cy="100" r="45" fill="#ec4899" opacity="0.3"/>
      <text x="480" y="106" fill="#ec4899" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sonic Acoustic Headphones</text>
      <text x="350" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Sonic Acoustic Pro</text>
      <text x="350" y="242" fill="#7d98b2" font-family="system-ui, sans-serif" font-size="12">Spatial Audio with ANC</text>
      <text x="350" y="285" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">$329.00</text>
      <rect x="510" y="265" width="105" height="32" rx="6" fill="#1e3247"/>
      <text x="562" y="285" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add to Cart</text>
      
      <!-- Item 3 - Live Cart / Checkout Sidebar -->
      <rect x="660" y="0" width="300" height="330" rx="12" fill="#101824" stroke="#22354a" stroke-width="1"/>
      <text x="680" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Live Stripe Edge Checkout</text>
      
      <rect x="680" y="60" width="260" height="60" rx="8" fill="#162232"/>
      <text x="695" y="85" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Total in Cart: 2 items</text>
      <text x="695" y="105" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">✓ Instant Apple Pay Ready</text>
      
      <rect x="680" y="135" width="260" height="110" rx="8" fill="#131e2b"/>
      <text x="695" y="160" fill="#7d98b2" font-family="system-ui, sans-serif" font-size="12">Subtotal: $828.00</text>
      <text x="695" y="185" fill="#7d98b2" font-family="system-ui, sans-serif" font-size="12">Global Express: Free</text>
      <text x="695" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Total: $828.00</text>
      
      <rect x="680" y="260" width="260" height="42" rx="8" fill="url(#tealGlow)"/>
      <text x="810" y="286" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚡ 1-Click Pay</text>
    </g>
  </g>
</svg>
