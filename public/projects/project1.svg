<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b131e"/>
      <stop offset="50%" stop-color="#0f1f2e"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152438" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c1724" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <path d="M 0 150 L 1200 150 M 0 300 L 1200 300 M 0 450 L 1200 450 M 0 600 L 1200 600" stroke="#1e2f42" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <path d="M 300 0 L 300 750 M 600 0 L 600 750 M 900 0 L 900 750" stroke="#1e2f42" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  
  <!-- Glow orbs -->
  <circle cx="950" cy="200" r="220" fill="#14b8a6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="250" cy="550" r="180" fill="#38bdf8" opacity="0.1" filter="blur(50px)"/>
  
  <!-- Dashboard Frame -->
  <g filter="url(#shadow)">
    <!-- Main Window -->
    <rect x="80" y="60" width="1040" height="630" rx="16" fill="url(#cardGrad)" stroke="#263d57" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#0d1825" opacity="0.9"/>
    <circle cx="115" cy="84" r="6" fill="#ef4444"/>
    <circle cx="135" cy="84" r="6" fill="#f59e0b"/>
    <circle cx="155" cy="84" r="6" fill="#10b981"/>
    
    <rect x="420" y="72" width="360" height="24" rx="6" fill="#15263a"/>
    <text x="600" y="88" fill="#7ba0c0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="500">analytics.nexusfintech.io/portfolio/live</text>
    
    <!-- Sidebar -->
    <rect x="80" y="108" width="220" height="582" fill="#0b1420" opacity="0.6"/>
    
    <!-- User / App info -->
    <circle cx="125" cy="148" r="18" fill="url(#tealGlow)"/>
    <text x="125" y="153" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NF</text>
    <text x="155" y="145" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Nexus Finance</text>
    <text x="155" y="160" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11">Enterprise Tier</text>
    
    <!-- Nav Items -->
    <rect x="96" y="195" width="188" height="36" rx="8" fill="#162e42"/>
    <text x="135" y="218" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Overview &amp; Yield</text>
    <circle cx="115" cy="213" r="4" fill="#2dd4bf"/>
    
    <text x="135" y="260" fill="#8da2b5" font-family="system-ui, sans-serif" font-size="13">Liquidity Pools</text>
    <circle cx="115" cy="256" r="3" fill="#47627a"/>
    
    <text x="135" y="300" fill="#8da2b5" font-family="system-ui, sans-serif" font-size="13">Risk Analytics</text>
    <circle cx="115" cy="296" r="3" fill="#47627a"/>
    
    <text x="135" y="340" fill="#8da2b5" font-family="system-ui, sans-serif" font-size="13">AI Predictions</text>
    <circle cx="115" cy="336" r="3" fill="#47627a"/>
    
    <text x="135" y="380" fill="#8da2b5" font-family="system-ui, sans-serif" font-size="13">API &amp; Webhooks</text>
    <circle cx="115" cy="376" r="3" fill="#47627a"/>
    
    <!-- KPI Cards Row -->
    <g transform="translate(325, 130)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="235" height="100" rx="12" fill="#121f2f" stroke="#223b54" stroke-width="1"/>
      <text x="18" y="30" fill="#7f9cb8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Total Portfolio Value</text>
      <text x="18" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">$2,849,420</text>
      <rect x="18" y="74" width="70" height="18" rx="4" fill="#0d332d"/>
      <text x="24" y="87" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+28.4% YTD</text>
      
      <!-- Card 2 -->
      <rect x="255" y="0" width="235" height="100" rx="12" fill="#121f2f" stroke="#223b54" stroke-width="1"/>
      <text x="273" y="30" fill="#7f9cb8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Real-time Volume</text>
      <text x="273" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">$842.6K / 24h</text>
      <rect x="273" y="74" width="65" height="18" rx="4" fill="#0d332d"/>
      <text x="279" y="87" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+14.2%</text>
      
      <!-- Card 3 -->
      <rect x="510" y="0" width="245" height="100" rx="12" fill="#121f2f" stroke="#223b54" stroke-width="1"/>
      <text x="528" y="30" fill="#7f9cb8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">AI Yield Score</text>
      <text x="528" y="65" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">99.4 / 100</text>
      <rect x="528" y="74" width="95" height="18" rx="4" fill="#162e42"/>
      <text x="534" y="87" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Optimal Alpha</text>
    </g>
    
    <!-- Main Chart Section -->
    <g transform="translate(325, 250)">
      <rect x="0" y="0" width="490" height="390" rx="12" fill="#101c2b" stroke="#1f364e" stroke-width="1"/>
      <text x="24" y="36" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Real-Time Yield Curve &amp; Volume</text>
      <text x="24" y="55" fill="#6d8ca8" font-family="system-ui, sans-serif" font-size="12">Aggregated across 14 Liquidity Protocols</text>
      
      <!-- Chart Area -->
      <path d="M 30 330 Q 120 280 200 290 T 320 200 T 400 130 T 465 95" fill="none" stroke="url(#tealGlow)" stroke-width="3.5"/>
      <path d="M 30 330 Q 120 280 200 290 T 320 200 T 400 130 T 465 95 L 465 350 L 30 350 Z" fill="url(#tealGlow)" opacity="0.15"/>
      
      <!-- Chart Nodes -->
      <circle cx="200" cy="290" r="5" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/>
      <circle cx="320" cy="200" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="465" cy="95" r="6" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/>
      
      <!-- Tooltip at peak -->
      <rect x="365" y="45" width="115" height="38" rx="6" fill="#162e42" stroke="#2dd4bf" stroke-width="1"/>
      <text x="375" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Peak: $2.84M</text>
      <text x="375" y="75" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">+32% Velocity</text>
    </g>
    
    <!-- Right Panel - Transactions / Breakdown -->
    <g transform="translate(835, 250)">
      <rect x="0" y="0" width="245" height="390" rx="12" fill="#101c2b" stroke="#1f364e" stroke-width="1"/>
      <text x="18" y="34" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Asset Allocation</text>
      
      <!-- Mini donut / bars -->
      <rect x="18" y="60" width="209" height="12" rx="6" fill="#1e334a"/>
      <rect x="18" y="60" width="110" height="12" rx="6" fill="#14b8a6"/>
      <rect x="128" y="60" width="60" height="12" rx="6" fill="#38bdf8"/>
      
      <!-- List Items -->
      <g transform="translate(18, 95)">
        <circle cx="8" cy="12" r="5" fill="#14b8a6"/>
        <text x="24" y="16" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">ETH Liquid Staking</text>
        <text x="200" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">52.4%</text>
      </g>
      <g transform="translate(18, 140)">
        <circle cx="8" cy="12" r="5" fill="#38bdf8"/>
        <text x="24" y="16" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">USDC Yield Vaults</text>
        <text x="200" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">28.6%</text>
      </g>
      <g transform="translate(18, 185)">
        <circle cx="8" cy="12" r="5" fill="#a855f7"/>
        <text x="24" y="16" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Arbitrum L2 Alpha</text>
        <text x="200" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">19.0%</text>
      </g>
      
      <!-- Status pill -->
      <rect x="18" y="270" width="209" height="90" rx="8" fill="#132437" stroke="#1f3d5c" stroke-width="1"/>
      <text x="30" y="295" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ Automated Rebalancing</text>
      <text x="30" y="315" fill="#7e9bb5" font-family="system-ui, sans-serif" font-size="11">Smart contract audited</text>
      <text x="30" y="335" fill="#7e9bb5" font-family="system-ui, sans-serif" font-size="11">Sub-second execution</text>
    </g>
  </g>
</svg>
