<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bgStay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b131e"/>
      <stop offset="50%" stop-color="#0f1f2e"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="tealGlowStay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGradStay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152438" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c1724" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadowStay" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bgStay)"/>
  <circle cx="950" cy="200" r="220" fill="#14b8a6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="250" cy="550" r="180" fill="#38bdf8" opacity="0.1" filter="blur(50px)"/>
  
  <g filter="url(#shadowStay)">
    <rect x="80" y="60" width="1040" height="630" rx="16" fill="url(#cardGradStay)" stroke="#263d57" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#0d1825" opacity="0.95"/>
    <circle cx="115" cy="84" r="6" fill="#ef4444"/>
    <circle cx="135" cy="84" r="6" fill="#f59e0b"/>
    <circle cx="155" cy="84" r="6" fill="#10b981"/>
    
    <rect x="400" y="72" width="400" height="24" rx="6" fill="#15263a"/>
    <text x="600" y="88" fill="#7ba0c0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="500">https://stayscape.onrender.com/explore</text>
    
    <!-- Sidebar -->
    <rect x="80" y="108" width="220" height="582" fill="#0b1420" opacity="0.8"/>
    
    <!-- Brand info -->
    <circle cx="125" cy="148" r="18" fill="url(#tealGlowStay)"/>
    <text x="125" y="154" fill="#041316" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🏕️</text>
    <text x="155" y="145" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">StayScape</text>
    <text x="155" y="162" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11">Peer-to-Peer Rentals</text>
    
    <!-- Nav Items -->
    <rect x="96" y="195" width="188" height="36" rx="8" fill="#162e42"/>
    <text x="135" y="218" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Explore Stays</text>
    <circle cx="115" cy="213" r="4" fill="#2dd4bf"/>
    
    <text x="135" y="260" fill="#8da2b5" font-family="system-ui, sans-serif" font-size="13">Host Dashboard</text>
    <text x="135" y="300" fill="#8da2b5" font-family="system-ui, sans-serif" font-size="13">Mapbox Geocode</text>
    <text x="135" y="340" fill="#8da2b5" font-family="system-ui, sans-serif" font-size="13">My Reservations</text>
    <text x="135" y="380" fill="#8da2b5" font-family="system-ui, sans-serif" font-size="13">Reviews &amp; Ratings</text>
    
    <!-- Main Content Area -->
    <!-- Top Search & Geolocation Filter -->
    <g transform="translate(325, 130)">
      <rect x="0" y="0" width="770" height="70" rx="12" fill="#111f30" stroke="#223a54" stroke-width="1"/>
      <text x="25" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Destination Search (Mapbox GL)</text>
      <text x="25" y="52" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Goa &amp; Western Ghats, India</text>
      
      <rect x="620" y="16" width="130" height="38" rx="8" fill="url(#tealGlowStay)"/>
      <text x="685" y="40" fill="#041316" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Find Stays</text>
    </g>
    
    <!-- Property Cards Grid -->
    <g transform="translate(325, 220)">
      <!-- Listing 1 -->
      <rect x="0" y="0" width="370" height="440" rx="14" fill="#101c2b" stroke="#1f364e" stroke-width="1"/>
      <!-- Property Photo Placeholder -->
      <rect x="15" y="15" width="340" height="200" rx="10" fill="#172b40"/>
      <circle cx="185" cy="115" r="45" fill="#2dd4bf" opacity="0.2"/>
      <text x="185" y="112" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="32" text-anchor="middle">🌊</text>
      <text x="185" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cloudinary HD Image</text>
      
      <rect x="30" y="30" width="85" height="24" rx="6" fill="#0b1622" opacity="0.85"/>
      <text x="72" y="46" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">★ 4.94 (68)</text>
      
      <text x="20" y="245" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Cliffside Oceanfront Villa</text>
      <text x="20" y="268" fill="#7ba0c0" font-family="system-ui, sans-serif" font-size="12">Anjuna Beach, Goa • Entire Villa • 3 Beds</text>
      <text x="20" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Verified Superhost • Infinity Pool • High-Speed WiFi</text>
      
      <text x="20" y="340" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">₹6,800 <tspan font-size="12" fill="#64748b">/ night</tspan></text>
      
      <rect x="235" y="318" width="120" height="34" rx="8" fill="#19354d"/>
      <text x="295" y="340" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Reserve Now</text>
      
      <!-- Listing 2 -->
      <rect x="400" y="0" width="370" height="440" rx="14" fill="#101c2b" stroke="#1f364e" stroke-width="1"/>
      <rect x="415" y="15" width="340" height="200" rx="10" fill="#172b40"/>
      <circle cx="585" cy="115" r="45" fill="#38bdf8" opacity="0.2"/>
      <text x="585" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="32" text-anchor="middle">🏔️</text>
      <text x="585" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cloudinary HD Image</text>
      
      <rect x="430" y="30" width="85" height="24" rx="6" fill="#0b1622" opacity="0.85"/>
      <text x="472" y="46" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">★ 4.88 (42)</text>
      
      <text x="420" y="245" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Himalayan Pine Wood Chalet</text>
      <text x="420" y="268" fill="#7ba0c0" font-family="system-ui, sans-serif" font-size="12">Old Manali, HP • Mountain View • 2 Beds</text>
      <text x="420" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Fireplace • Dedicated Workspace • Pet Friendly</text>
      
      <text x="420" y="340" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">₹4,250 <tspan font-size="12" fill="#64748b">/ night</tspan></text>
      
      <rect x="635" y="318" width="120" height="34" rx="8" fill="#19354d"/>
      <text x="695" y="340" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Reserve Now</text>
    </g>
  </g>
</svg>
