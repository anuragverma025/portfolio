<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b131a"/>
      <stop offset="50%" stop-color="#111d28"/>
      <stop offset="100%" stop-color="#090e15"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bg4)"/>
  <circle cx="850" cy="200" r="220" fill="#3b82f6" opacity="0.1" filter="blur(60px)"/>
  <circle cx="300" cy="550" r="180" fill="#10b981" opacity="0.1" filter="blur(50px)"/>
  
  <g filter="url(#shadow4)">
    <rect x="80" y="60" width="1040" height="630" rx="16" fill="#0f1924" stroke="#1d2e40" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#0b121a"/>
    <circle cx="115" cy="84" r="6" fill="#ef4444"/>
    <circle cx="135" cy="84" r="6" fill="#f59e0b"/>
    <circle cx="155" cy="84" r="6" fill="#10b981"/>
    
    <rect x="420" y="72" width="360" height="24" rx="6" fill="#1a2837"/>
    <text x="600" y="88" fill="#8ca5be" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">app.syncflow-collab.io/sprint-42</text>
    
    <!-- Kanban Board Columns -->
    <g transform="translate(110, 130)">
      <!-- Col 1: Backlog -->
      <rect x="0" y="0" width="310" height="520" rx="12" fill="#0d1620" stroke="#1c2c3d" stroke-width="1"/>
      <text x="20" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">IN PLANNING (4)</text>
      <circle cx="280" cy="30" r="10" fill="#1e293b"/>
      <text x="280" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">4</text>
      
      <!-- Card 1.1 -->
      <rect x="15" y="60" width="280" height="110" rx="8" fill="#152230" stroke="#23364c" stroke-width="1"/>
      <rect x="25" y="75" width="60" height="18" rx="4" fill="#3b82f6" opacity="0.2"/>
      <text x="32" y="88" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CORE API</text>
      <text x="25" y="115" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">WebSocket Cluster Scaling</text>
      <text x="25" y="135" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Implement Redis pub/sub channels</text>
      <circle cx="270" cy="145" r="10" fill="#3b82f6"/>
      <text x="270" y="149" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">PM</text>
      
      <!-- Card 1.2 -->
      <rect x="15" y="185" width="280" height="100" rx="8" fill="#152230" stroke="#23364c" stroke-width="1"/>
      <rect x="25" y="200" width="70" height="18" rx="4" fill="#8b5cf6" opacity="0.2"/>
      <text x="32" y="213" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10" font-weight="700">FRONTEND</text>
      <text x="25" y="240" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Multi-cursor Canvas Sync</text>
      <text x="25" y="260" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Yjs CRDT integration test</text>
      
      <!-- Col 2: In Progress -->
