      <text x="360" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Active users: 8 typing simultaneously</text>
      
      <!-- Avatars -->
      <circle cx="370" cy="165" r="10" fill="#14b8a6"/>
      <circle cx="390" cy="165" r="10" fill="#38bdf8"/>
      <circle cx="410" cy="165" r="10" fill="#f59e0b"/>
      <text x="430" y="169" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+5 online</text>
      
      <!-- Card 2.2 -->
      <rect x="350" y="210" width="280" height="100" rx="8" fill="#152230" stroke="#23364c" stroke-width="1"/>
      <rect x="360" y="225" width="60" height="18" rx="4" fill="#f59e0b" opacity="0.2"/>
      <text x="367" y="238" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">DEVOPS</text>
      <text x="360" y="265" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Zero-downtime Blue/Green</text>
      <text x="360" y="285" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Kubernetes rolling update</text>
      
      <!-- Col 3: Done / Shipped -->
      <rect x="670" y="0" width="310" height="520" rx="12" fill="#0d1620" stroke="#1c2c3d" stroke-width="1"/>
      <text x="690" y="35" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">SHIPPED TO PRODUCTION (12)</text>
      
      <!-- Card 3.1 -->
      <rect x="685" y="60" width="280" height="100" rx="8" fill="#13202d" stroke="#1e344a" stroke-width="1"/>
      <rect x="695" y="75" width="70" height="18" rx="4" fill="#10b981" opacity="0.2"/>
      <text x="702" y="88" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">RELEASED</text>
      <text x="695" y="115" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Audit Logs &amp; SSO OAuth</text>
      <text x="695" y="135" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Okta + Google Workspace sync</text>
      
      <!-- Card 3.2 -->
      <rect x="685" y="175" width="280" height="100" rx="8" fill="#13202d" stroke="#1e344a" stroke-width="1"/>
      <rect x="695" y="190" width="70" height="18" rx="4" fill="#10b981" opacity="0.2"/>
      <text x="702" y="203" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">RELEASED</text>
      <text x="695" y="230" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Dynamic Video Call Canvas</text>
      <text x="695" y="250" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">WebRTC mesh with screen sharing</text>
    </g>
