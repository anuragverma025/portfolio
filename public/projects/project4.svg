      <text x="355" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">IN ACTIVE SPRINT (3)</text>
      
      <!-- Card 2.1 (Active live synced) -->
      <rect x="350" y="60" width="280" height="135" rx="8" fill="#172637" stroke="#2dd4bf" stroke-width="1.5"/>
      <rect x="360" y="75" width="80" height="18" rx="4" fill="#14b8a6" opacity="0.2"/>
