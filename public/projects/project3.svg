<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bgRL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="purpleGlowRL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tealGradRL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadowRL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bgRL)"/>
  <circle cx="900" cy="200" r="220" fill="#8b5cf6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="250" cy="550" r="180" fill="#14b8a6" opacity="0.1" filter="blur(50px)"/>
  
  <g filter="url(#shadowRL)">
    <rect x="80" y="60" width="1040" height="630" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#090d16" opacity="0.95"/>
    <circle cx="115" cy="84" r="6" fill="#ef4444"/>
    <circle cx="135" cy="84" r="6" fill="#f59e0b"/>
    <circle cx="155" cy="84" r="6" fill="#10b981"/>
    
    <rect x="360" y="72" width="480" height="24" rx="6" fill="#1e293b"/>
    <text x="600" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="500">https://huggingface.co/spaces/Anurag137/enterprise-ops-arena</text>
    
    <!-- Left Workspace (Simulation & RL Policy Training) -->
    <g transform="translate(110, 130)">
      <rect x="0" y="0" width="580" height="520" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Tab Bar -->
      <rect x="0" y="0" width="580" height="40" rx="12" fill="#0f172a"/>
      <rect x="15" y="8" width="170" height="26" rx="6" fill="#1e293b"/>
      <text x="100" y="25" fill="#38bdf8" font-family="monospace" font-size="11.5" text-anchor="middle">multi_agent_env.py</text>
      
      <!-- Code lines -->
      <g transform="translate(20, 60)" font-family="monospace" font-size="11.5">
        <text y="0" fill="#64748b">1</text> <text x="30" y="0" fill="#c084fc">import</text> <text x="80" y="0" fill="#f8fafc">torch, trl, wandb, openenv</text>
        <text y="24" fill="#64748b">2</text> <text x="30" y="24" fill="#c084fc">from</text> <text x="65" y="24" fill="#f8fafc">trl</text> <text x="95" y="24" fill="#c084fc">import</text> <text x="145" y="24" fill="#38bdf8">PPOTrainer, PPOConfig</text>
        <text y="48" fill="#64748b">3</text>
        <text y="72" fill="#64748b">4</text> <text x="30" y="72" fill="#c084fc">class</text> <text x="75" y="72" fill="#2dd4bf">EnterpriseIncidentArena</text><text x="250" y="72" fill="#f8fafc">(MultiAgentEnv):</text>
        <text y="96" fill="#64748b">5</text> <text x="50" y="96" fill="#94a3b8">"""Partially Observable RL Incident Simulation"""</text>
        <text y="120" fill="#64748b">6</text> <text x="50" y="120" fill="#c084fc">def</text> <text x="80" y="120" fill="#4ade80">step</text><text x="115" y="120" fill="#f8fafc">(self, actions):</text>
        <text y="144" fill="#64748b">7</text> <text x="75" y="144" fill="#f8fafc">obs, rewards, dones, info = self.simulate_outage(actions)</text>
        <text y="168" fill="#64748b">8</text> <text x="75" y="168" fill="#c084fc">return</text> <text x="130" y="168" fill="#f8fafc">obs, self.compute_ppo_reward(rewards), dones, info</text>
      </g>
      
      <!-- Interactive Terminal Output inside Left Workspace -->
      <g transform="translate(15, 260)">
        <rect x="0" y="0" width="550" height="240" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="25" fill="#2dd4bf" font-family="monospace" font-size="11">✓ Meta OpenEnv Connected • Docker Container Initialized</text>
        <text x="15" y="48" fill="#a855f7" font-family="monospace" font-size="11">⚡ PPO Multi-Agent Policy Training Episode: 1,480 / 2,000</text>
        <text x="15" y="71" fill="#38bdf8" font-family="monospace" font-size="11">→ WandB Metric Sync: Mean Incident Resolution Time: -64.2%</text>
        
        <rect x="15" y="90" width="520" height="135" rx="6" fill="#0f172a"/>
        <text x="30" y="118" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Multi-Agent State Feedback:</text>
        <text x="30" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">"Agent-1 (Triage) isolated database latency anomaly in 4.2s.</text>
        <text x="30" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Agent-2 (Mitigation) executed failover pod reallocation successfully.</text>
        <text x="30" y="180" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5">Simulation SLA: 100% Guaranteed • Top 800 Global Hackathon Finish"</text>
      </g>
    </g>
    
    <!-- Right Panel (Agent Nodes & Metrics) -->
    <g transform="translate(710, 130)">
      <rect x="0" y="0" width="370" height="520" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      
      <text x="25" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Multi-Agent RL Arena</text>
      <text x="25" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="11.5">Hugging Face TRL &amp; Meta PyTorch Hackathon</text>
      
      <!-- Node 1 -->
      <g transform="translate(25, 80)">
        <rect x="0" y="0" width="320" height="68" rx="10" fill="#131d33" stroke="#2563eb" stroke-width="1"/>
        <circle cx="25" cy="34" r="10" fill="#3b82f6"/>
        <text x="45" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Incident Triage Agent</text>
        <text x="45" y="48" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Observes telemetry logs &amp; anomaly spikes</text>
      </g>
      
      <!-- Node 2 -->
      <g transform="translate(25, 165)">
        <rect x="0" y="0" width="320" height="68" rx="10" fill="#131d33" stroke="#8b5cf6" stroke-width="1"/>
        <circle cx="25" cy="34" r="10" fill="#a855f7"/>
        <text x="45" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Diagnostic &amp; Policy Optimizer</text>
        <text x="45" y="48" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11">PPO Policy gradient action synthesis</text>
      </g>
      
      <!-- Node 3 -->
      <g transform="translate(25, 250)">
        <rect x="0" y="0" width="320" height="68" rx="10" fill="#131d33" stroke="#10b981" stroke-width="1"/>
        <circle cx="25" cy="34" r="10" fill="#10b981"/>
        <text x="45" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Automated Resolution Agent</text>
        <text x="45" y="48" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Executes container mitigation routines</text>
      </g>
      
      <!-- Metrics Card -->
      <g transform="translate(25, 345)">
        <rect x="0" y="0" width="320" height="150" rx="10" fill="#0e172a" stroke="#1e293b" stroke-width="1"/>
        <text x="20" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">REINFORCEMENT LEARNING METRICS</text>
        <text x="20" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Top 800 Global</text>
        <text x="20" y="78" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11.5">Meta PyTorch Hackathon (31,000+ teams)</text>
        <text x="20" y="100" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5">Framework: HF TRL • PPO • WandB</text>
        <text x="20" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Deployed: Docker &amp; Hugging Face Spaces</text>
      </g>
    </g>
  </g>
</svg>
